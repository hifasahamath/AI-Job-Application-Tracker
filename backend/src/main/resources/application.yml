server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

spring:
  application:
    name: ai-job-tracker-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobtracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      validation-timeout: 5000
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

# JWT Security Configuration
app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLTI1Ni1iaXQtbG9uZy1qd3Qtc2VjcmV0LWtleS1mb3ItYWktam9iLXRyYWNrZXItYXBwbGljYXRpb24=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

# Gemini AI Integration Configuration
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.7-flash}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
    timeout-ms: 30000

# Supabase Storage Configuration
supabase:
  url: ${SUPABASE_URL:https://xhdgmzhtexydpcrnciqf.supabase.co}
  service-key: ${SUPABASE_SERVICE_KEY:}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:profile-pictures}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true

logging:
  level:
    root: INFO
    com.jobtracker: DEBUG
    org.springframework.security: INFO
