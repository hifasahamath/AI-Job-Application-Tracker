server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /

spring:
  application:
    name: ai-job-tracker-backend
  datasource:
    # Defaults to local embedded file DB with PostgreSQL compatibility mode if no external PostgreSQL/Supabase URL is set
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/jobtracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

# JWT Security Configuration
app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLTI1Ni1iaXQtbG9uZy1qd3Qtc2VjcmV0LWtleS1mb3ItYWktam9iLXRyYWNrZXItYXBwbGljYXRpb24=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

# Gemini AI Integration Configuration
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
    timeout-ms: 30000

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true

logging:
  level:
    root: INFO
    com.jobtracker: DEBUG
    org.springframework.security: INFO
